project_name: kcrow-plugins
version: 2
before:
  hooks:
  - go mod tidy

builds:
  - id: "override"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/override/main.go
    binary: override

  - id: "escape"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/escape/main.go
    binary: escape

  - id: "memory"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/memory/main.go
    binary: memory

  - id: "limit"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/limit/main.go
    binary: limit

nfpms:
  - id: package
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    maintainer: "kcrow-io <noreply@github.com>"
    formats:
      - deb
      - rpm
    bindir: /opt/nri/bin
    contents:
    - src: "README.md"
      dst: "/usr/share/doc/{{ .ProjectName }}/README.md"
      file_info:
        mode: 0644

archives:
  - id: tar
    wrap_in_directory: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  github:
    owner: kcrow-io
    name: plugins
