{
  "disabled": false,
  "containerd_config_path": "/etc/containerd/config.toml",
  "io" : {
    "max_disk_bytes": 10737418240,
    "bps_limit": 4194304,
    "iops_limit": 10,
    "exclude_namespaces": ["ems"]
  },
  "memory": {
    "pods-usage-percent": 80,
    "cache-rss-ratio": 10,
    "min-cache-bytes": 536870912
  },
  "watch_interval": 60,
  "log_path": "/var/log/nri-limit.log"
}
