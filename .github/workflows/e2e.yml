name: e2e

on:
  push:
    branches: ["feature/*"]
  pull_request:
    branches: [main]

jobs:
  e2e:
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install containerd
        run: |
          chmod +x scripts/install_containerd
          sudo ./scripts/install_containerd

      - name: Install crictl
        run: |
          chmod +x scripts/install_crictl
          sudo ./scripts/install_crictl

      - name: Install CNI plugins
        run: |
          chmod +x scripts/install_cni_plugins
          sudo ./scripts/install_cni_plugins

      - name: Copy CNI configuration
        run: |
          sudo mkdir -p /etc/cni/net.d
          sudo cp integration/testdata/10-containerd.conflist /etc/cni/net.d/

      - name: Run e2e tests
        env:
          GOCACHE: /tmp/go-build
          SUDO_CMD: "sudo"
        run: make e2e
