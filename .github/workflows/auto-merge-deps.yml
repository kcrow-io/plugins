name: Auto-merge Dependency PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' ||
      (github.actor == 'github-actions[bot]' && contains(github.event.pull_request.title, 'Auto-update Go dependencies'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PR details
        id: pr-check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Check if this is a dependency update PR
            const isDependencyPR = pr.title.includes('deps') ||
                                  pr.title.includes('dependencies') ||
                                  pr.title.includes('Auto-update') ||
                                  pr.user.login === 'dependabot[bot]';

            // Check if PR has dependency labels
            const hasDependencyLabel = pr.labels.some(label =>
              label.name === 'dependencies' ||
              label.name === 'automated'
            );

            console.log(`PR Title: ${pr.title}`);
            console.log(`PR Author: ${pr.user.login}`);
            console.log(`Is Dependency PR: ${isDependencyPR}`);
            console.log(`Has Dependency Label: ${hasDependencyLabel}`);

            return {
              isDependencyPR: isDependencyPR,
              hasDependencyLabel: hasDependencyLabel,
              canAutoMerge: isDependencyPR || hasDependencyLabel
            };

      - name: Wait for CI checks
        if: fromJSON(steps.pr-check.outputs.result).canAutoMerge
        uses: actions/github-script@v7
        with:
          script: |
            const maxWaitTime = 20 * 60 * 1000; // 20 minutes
            const checkInterval = 30 * 1000; // 30 seconds
            const startTime = Date.now();

            while (Date.now() - startTime < maxWaitTime) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              });

              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              });

              // Check if all checks are completed
              const allChecks = [...checks.check_runs, ...statuses];
              const pendingChecks = allChecks.filter(check =>
                check.status === 'in_progress' ||
                check.status === 'queued' ||
                check.state === 'pending'
              );

              const failedChecks = allChecks.filter(check =>
                check.conclusion === 'failure' ||
                check.state === 'failure' ||
                check.conclusion === 'cancelled' ||
                check.state === 'error'
              );

              console.log(`Pending checks: ${pendingChecks.length}`);
              console.log(`Failed checks: ${failedChecks.length}`);
              console.log(`Total checks: ${allChecks.length}`);

              if (failedChecks.length > 0) {
                console.log('❌ Some checks failed, cannot auto-merge');
                core.setFailed('CI checks failed');
                return;
              }

              if (pendingChecks.length === 0 && allChecks.length > 0) {
                console.log('✅ All checks passed!');
                return;
              }

              if (allChecks.length === 0) {
                console.log('⏳ No checks found yet, waiting...');
              } else {
                console.log('⏳ Waiting for checks to complete...');
              }

              await new Promise(resolve => setTimeout(resolve, checkInterval));
            }

            console.log('⏰ Timeout waiting for checks');
            core.setFailed('Timeout waiting for CI checks');

      - name: Auto-approve PR
        if: fromJSON(steps.pr-check.outputs.result).canAutoMerge && github.actor == 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: '✅ Auto-approved dependency update PR after successful CI checks.'
            });

      - name: Enable auto-merge
        if: fromJSON(steps.pr-check.outputs.result).canAutoMerge
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                commit_title: `${context.payload.pull_request.title} (#${context.payload.pull_request.number})`,
                commit_message: 'Auto-merged dependency update after successful CI checks.',
                merge_method: 'squash'
              });

              console.log('✅ Successfully auto-merged dependency PR');

              // Add a comment to the PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '🤖 **Auto-merged** this dependency update PR after all CI checks passed successfully.\n\n' +
                      '✅ Build: Passed\n' +
                      '✅ Tests: Passed\n' +
                      '✅ Security: Checked\n\n' +
                      '*This action was performed automatically by the dependency management workflow.*'
              });

            } catch (error) {
              console.log(`❌ Failed to auto-merge: ${error.message}`);

              // If merge fails, add a comment explaining why
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `⚠️ **Auto-merge failed**: ${error.message}\n\n` +
                      'This dependency update PR requires manual review and merge.\n\n' +
                      'Possible reasons:\n' +
                      '- Merge conflicts\n' +
                      '- Branch protection rules\n' +
                      '- Required reviews not met\n\n' +
                      'Please review and merge manually if appropriate.'
              });

              core.setFailed(`Auto-merge failed: ${error.message}`);
            }

  notify-merge-status:
    needs: auto-merge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create merge summary
        run: |
          echo "## 🔄 Auto-merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author**: ${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.auto-merge.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.auto-merge.result }}" == "success" ]; then
            echo "✅ **Result**: Successfully auto-merged dependency update" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Result**: Auto-merge failed - manual intervention required" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Processed at: $(date)*" >> $GITHUB_STEP_SUMMARY