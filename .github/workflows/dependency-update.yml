name: Dependency Update Check

on:
  schedule:
    # Run every Monday at 9:00 AM Beijing time (01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all dependencies'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    outputs:
      has-updates: ${{ steps.check.outputs.has-updates }}
      update-summary: ${{ steps.check.outputs.update-summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Install go-mod-outdated
        run: go install github.com/psampaz/go-mod-outdated@latest

      - name: Check for outdated dependencies
        id: check
        run: |
          echo "Checking for outdated Go dependencies..."

          # Get current dependencies
          go list -u -m -json all | go-mod-outdated -update -direct > outdated.json || true

          # Check if there are any updates
          if [ -s outdated.json ]; then
            echo "has-updates=true" >> $GITHUB_OUTPUT
            echo "Found outdated dependencies:"
            cat outdated.json

            # Create summary
            SUMMARY=$(cat outdated.json | jq -r '.[] | "- \(.Module): \(.Current) → \(.Update)"' | head -20)
            echo "update-summary<<EOF" >> $GITHUB_OUTPUT
            echo "$SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has-updates=false" >> $GITHUB_OUTPUT
            echo "All dependencies are up to date!"
          fi

      - name: Upload outdated dependencies report
        if: steps.check.outputs.has-updates == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: outdated-dependencies
          path: outdated.json
          retention-days: 7

  create-update-pr:
    needs: check-dependencies
    if: needs.check-dependencies.outputs.has-updates == 'true' || github.event.inputs.force_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create update branch
        run: |
          BRANCH_NAME="deps/auto-update-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Update Go dependencies
        run: |
          echo "Updating Go dependencies..."

          # Update all dependencies to latest minor/patch versions
          go get -u ./...

          # Update go.mod and go.sum
          go mod tidy

          # Verify the build still works
          go mod verify
          make build || (echo "Build failed after dependency update" && exit 1)

      - name: Run tests
        run: |
          echo "Running tests to ensure compatibility..."
          go test ./... || (echo "Tests failed after dependency update" && exit 1)

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has-changes=true" >> $GITHUB_OUTPUT

            # Get list of updated modules
            UPDATED_MODULES=$(git diff go.mod | grep "^+" | grep -v "^+++" | sed 's/^+//' | grep -E "^\s*github\.com|^\s*golang\.org|^\s*google\.golang\.org|^\s*k8s\.io" | head -10)
            echo "updated-modules<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATED_MODULES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.has-changes == 'true'
        run: |
          git add go.mod go.sum
          git commit -m "deps: update Go dependencies

          Automated dependency update:
          ${{ steps.changes.outputs.updated-modules }}

          - Updated dependencies to latest compatible versions
          - Verified build and tests pass
          - Generated by GitHub Actions"

      - name: Push changes
        if: steps.changes.outputs.has-changes == 'true'
        run: |
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.changes.outputs.has-changes == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-update Go dependencies',
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: `## 📦 Dependency Updates

            This PR contains automated dependency updates for Go modules.

            ### 🔄 Updated Dependencies
            ${{ needs.check-dependencies.outputs.update-summary }}

            ### ✅ Verification
            - [x] Build passes
            - [x] Tests pass
            - [x] Dependencies verified

            ### 🤖 Automation
            This PR was created automatically by the dependency update workflow.
            Please review the changes and merge if everything looks good.

            ---
            *Generated by GitHub Actions on ${new Date().toISOString()}*`
            });

            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['dependencies', 'automated', 'go']
            });

            console.log(`Created PR #${pr.number}: ${pr.html_url}`);

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security audit
        run: |
          echo "Running security vulnerability check..."
          govulncheck ./... || echo "Vulnerabilities found - please review"

      - name: Run Go security checker
        uses: securecodewarrior/github-action-add-sarif@v1
        if: always()
        with:
          sarif-file: 'govulncheck.sarif'
        continue-on-error: true

  notify-results:
    needs: [check-dependencies, create-update-pr, security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        run: |
          echo "## 📊 Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.check-dependencies.outputs.has-updates }}" == "true" ]; then
            echo "✅ **Updates Available**: Found outdated dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Available Updates:" >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.check-dependencies.outputs.update-summary }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All Up to Date**: No dependency updates needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Auto-PR Creation: ${{ needs.create-update-pr.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Last updated: $(date)*" >> $GITHUB_STEP_SUMMARY